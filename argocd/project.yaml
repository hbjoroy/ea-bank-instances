apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bank-instances
  namespace: argocd
spec:
  description: Bjorøy Bank deployment instances
  sourceRepos:
    - 'https://github.com/hbjoroy/ea-bank-instances.git'
    - 'oci://oci.bjoroy.me/bank'
    - 'oci://oci.bjoroy.me/bank/*'
    - 'oci://oci.bjoroy.me/heart'
    - 'oci://oci.bjoroy.me/heart/*'
  destinations:
    # Allow deployment to any namespace in the local cluster
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
