apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank-chat
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - instance: minoa-bank
            releaseName: minoa
            chatChartVersion: "0.1.95"
            useVllm: "true"
            instanceId: "minoa"
            instanceName: "Minoa Bank"
            domain: "bjoroy.me"
            oidcIssuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
            oidcAudience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"
            multiAgentMode: "true"
          - instance: isdalen
            releaseName: isdalen
            chatChartVersion: "0.1.95"
            useVllm: "true"
            instanceId: "isdalen"
            instanceName: "Isdalen Bank"
            domain: "bjoroy.me"
            oidcIssuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
            oidcAudience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"
            multiAgentMode: "true"
  template:
    metadata:
      name: 'chat-{{ .instance }}'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        bank-service: chat
        bank-instance: '{{ .instance }}'
    spec:
      project: bank-instances
      source:
        repoURL: oci://oci.bjoroy.me/bank/chat-chart
        chart: chat-chart
        targetRevision: '{{ .chatChartVersion }}'
        helm:
          releaseName: '{{ .releaseName }}'
          values: |
            global:
              instanceId: "{{ .instanceId }}"
              domain: "{{ .domain }}"
              imageRegistry: oci.bjoroy.me/bank
            instanceName: "{{ .instanceName }}"
            oidc:
              issuerUrl: "{{ .oidcIssuerUrl }}"
              audience: "{{ .oidcAudience }}"
            {{ if eq .useVllm "true" }}
            llm:
              provider: "openai"
              openaiBaseUrl: "http://192.168.68.152:8000"
              openaiUseServerDefaultModel: true
              openaiExistingSecret: "bank-chat-vllm"
            {{ else }}
            ollama:
              url: "http://192.168.68.152:11434"
              model: "qwen27b-santorini:latest"
              numCtx: 0
            llm:
              provider: "ollama"
            {{ end }}
            chatService:
              multiAgentMode: {{ eq .multiAgentMode "true" }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .instance }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
