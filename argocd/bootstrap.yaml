apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-platform-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hbjoroy/ea-bank-instances.git
    targetRevision: master
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
