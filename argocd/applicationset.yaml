apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank-instances
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - branch: minoa-bank
          - branch: isdalen
          - branch: bragd-rtgs
  template:
    metadata:
      name: '{{ .branch }}'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        bank-instance: '{{ .branch }}'
    spec:
      project: bank-instances
      source:
        repoURL: https://github.com/hbjoroy/ea-bank-instances.git
        targetRevision: '{{ .branch }}'
        path: '.'
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .branch }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
