apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank-instances
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # autoSync: "true" → automated prune + selfHeal
          # autoSync: "false" → manual sync only (safe for existing instances)
          # releaseName: Helm release name (must match original helm install)
          - branch: bragd-rtgs
            releaseName: bragd-rtgs
            autoSync: "true"
          - branch: minoa-bank
            releaseName: minoa
            autoSync: "false"
          - branch: isdalen
            releaseName: isdalen
            autoSync: "false"
  template:
    metadata:
      name: '{{ .branch }}'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        bank-instance: '{{ .branch }}'
    spec:
      project: bank-instances
      source:
        repoURL: https://github.com/hbjoroy/ea-bank-instances.git
        targetRevision: '{{ .branch }}'
        path: '.'
        helm:
          releaseName: '{{ .releaseName }}'
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .branch }}'
      syncPolicy:
        {{- if eq .autoSync "true" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
