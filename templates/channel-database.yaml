{{- $bank := index .Values "bjoroy-bank" -}}
{{- if $bank.channelSvc.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-channel-db-setup
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: ensure-channel-db
          image: docker.io/library/postgres:17
          env:
            - name: PGHOST
              value: {{ $bank.global.dbHost | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGUSER
              value: minoa_bank
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
                  optional: true
          command:
            - sh
            - -ec
            - |
              exists=$(psql -XAt -d minoa_bank -c "SELECT count(*) FROM pg_database WHERE datname = 'minoa_channel'")
              if [ "$exists" = 0 ]; then
                if [ -n "${ADMIN_PASSWORD:-}" ]; then
                  PGUSER=postgres PGPASSWORD="$ADMIN_PASSWORD" psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE minoa_channel OWNER minoa_bank'
                else
                  psql -X -v ON_ERROR_STOP=1 -d minoa_bank -c 'CREATE DATABASE minoa_channel OWNER minoa_bank'
                fi
              fi
              psql -X -v ON_ERROR_STOP=1 -d minoa_channel -c 'SELECT 1'
{{- end }}
