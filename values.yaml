# Minoa Bank — instance overrides
# All other values inherit from the bjoroy-bank chart defaults

bjoroy-bank:
  global:
    instanceId: "minoa"
    domain: "bjoroy.me"
    imageTag: "1.4.41"
    imageRegistry: "oci.bjoroy.me/bank"
    dbHost: "postgres-postgresql.database.svc.cluster.local"

  # ── Bank identity (overrides chart defaults) ────────────────────
  bank:
    institution:
      bic: "MINOANO1XXX"
      name: "Minoa Bank"
      countryCode: "NO"
    prefix:
      type: "BKREG"
      value: "3188"
    series:
      - name: "Current Accounts"
        description: "Current accounts (3188 110000–119999)"
        rangeStart: 110000
        rangeEnd: 119999
      - name: "Savings Accounts"
        description: "Savings accounts (3188 120000–124999)"
        rangeStart: 120000
        rangeEnd: 124999
    products:
      - name: "Current Account"
        productType: "current_account"
        currency: "NOK"
        interestRate: "0.5"
        seriesIndex: 0
      - name: "Savings Account"
        productType: "savings_account"
        currency: "NOK"
        interestRate: "3.5"
        seriesIndex: 1

  # ── OIDC (Authentik) ──────────────────────────────────────────
  oidc: &bankOidc
    issuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
    jwksUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/jwks/"
    audience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"

  # ── Channel Service ────────────────────────────────────────────
  channelSvc:
    enabled: true
    oidc: *bankOidc
    channelSvc:
      imageTag: "0.1.1"

  # ── Auth Service ───────────────────────────────────────────────
  authService:
    imageTag: "1.4.24"

  # ── SCA UI ─────────────────────────────────────────────────────
  scaUi:
    imageTag: "1.4.24"

  # ── Core API ──────────────────────────────────────────────────
  coreApi:
    imageTag: "1.4.46@sha256:ee3d7f7147cfeb298477d62e7c04b9b09f2cbbb3243cc0d39ea9a758f4cad55a"

  # ── Admin API ────────────────────────────────────────────────
  adminApi:
    imageTag: "1.4.46@sha256:1ab3d8800c97a8cce82ae7883f88424365d17cab83b13f42be9dda7fccdabe92"

  # ── Channel Gateway ───────────────────────────────────────────
  channelGateway:
    scaBaseUrl: "https://minoa-bank.bjoroy.me"
    imageTag: "1.4.24"

  # ── Payment Engine (interbank) ────────────────────────────────
  paymentEngine:
    centralBankUrl: "http://bragd-rtgs-bragd-api.bragd-rtgs.svc.cluster.local:8095"
    bankId: "MINO"
    bankSortCodes: "3188,3606,3607,3608,3609,3610"
    nostroScheme: "bragd"
    imageTag: "1.4.46@sha256:7f16d0eb26c9e3bceba2643f9fe6ad05289171067e34bab9bb87aadf1a3bf40e"

  # ── RTP Service Provider ────────────────────────────────────
  rtpSpApi:
    enabled: true
    imageTag: "0.2.4"
    participantName: "Minoa Bank"
    bankBic: "MINOBRXX"
    ibanPrefixes: "NO3188,NO3606,NO3607,NO3608,NO3609,NO3610"

  bankCalendarCutover:
    version: "deposit-interest-v1"
    openingApproval:
      bankInstanceId: "8ad66301-2528-4aff-a878-f5814957abfb"
      firstBankDate: "2026-11-21"
      sha256: "abc4cc76af21f369ee7c2985be1743d161be255c732205c554256bf7aee46e91"
      approvedBy: "Harald Bjorøy / ISDALEN-MINOA-20261121 / 2026-11-20"

  # ── Definitions Service ──────────────────────────────────────
  definitionsService:
    imageTag: "1.4.46@sha256:a864d4e62b3dbacb132bcd53781e4697a47335c54d2fa93ec99d4929573ebf8e"

  # ── Scheduler ────────────────────────────────────────────────
  scheduler:
    imageTag: "1.4.46@sha256:e6014d447c828dc03144d3e959c50bc8e03c47052cc13faae20b1cda24046469"

  # ── Accounting (subchart) ─────────────────────────────────────
  accounting:
    accountingApi:
      imageTag: "git-842c8197d3fba047f6fb096576f135e867da7228@sha256:5ed2db870e1e84d69659a4c4e19c9b1f322b5679eced43c9763fb47961f3132b"
      bankTimezone: "Europe/Oslo"
      requireDepositOpening: true

  heart:
