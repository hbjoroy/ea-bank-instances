# FIFTH Network — shared infrastructure services
fifth-network:
  imageRegistry: "oci.bjoroy.me/fifth"
  imageTag: "0.2.6"

  database:
    host: "postgres-postgresql.database.svc.cluster.local"
    port: 5432
    name: "fifth_network"
    user: "postgres"
    existingSecret: "postgres-admin"
    existingSecretKey: "password"

  bicRegistry:
    port: 8091

  rtpDirectory:
    imageRegistry: "oci.bjoroy.me/rtp"
    imageTag: "0.2.6"
    port: 8094

  adminUi:
    enabled: true
    imageTag: "0.2.6"

  setup:
    enabled: true
    existingSecret: "postgres-admin"
    existingSecretKey: "password"

  migration:
    enabled: true
