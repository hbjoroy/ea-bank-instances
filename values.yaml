# Isdalen Bank — instance overrides
# All other values inherit from the bjoroy-bank chart defaults

bjoroy-bank:
  global:
    instanceId: "isdalen"
    domain: "bjoroy.me"
    imageTag: "1.4.28"
    imageRegistry: "oci.bjoroy.me/bank"
    dbHost: "postgres-postgresql.database.svc.cluster.local"

  # ── Bank identity ───────────────────────────────────────────────
  bank:
    institution:
      bic: "ISDANO1XXX"
      name: "Isdalen Bank"
      countryCode: "NO"
    prefix:
      type: "BKREG"
      value: "3288"
    series:
      - name: "Current Accounts"
        description: "Current accounts (3288 110000–119999)"
        rangeStart: 110000
        rangeEnd: 119999
      - name: "Savings Accounts"
        description: "Savings accounts (3288 120000–124999)"
        rangeStart: 120000
        rangeEnd: 124999
    products:
      - name: "Current Account"
        productType: "current_account"
        currency: "NOK"
        interestRate: "0.5"
        seriesIndex: 0
      - name: "Savings Account"
        productType: "savings_account"
        currency: "NOK"
        interestRate: "3.5"
        seriesIndex: 1

  # ── OIDC (Authentik) ──────────────────────────────────────────
  oidc:
    issuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
    jwksUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/jwks/"
    audience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"

  # ── Chat Service ──────────────────────────────────────────────
  chatService:
    enabled: true
    instanceName: "Isdalen Bank"
    channelContext:
      url: "http://isdalen-channel-svc:8095"

  # ── Channel Service ────────────────────────────────────────────
  channelSvc:
    enabled: true
    channelSvc:
      imageTag: "0.1.0"

  # ── Auth Service ───────────────────────────────────────────────
  authService:
    imageTag: "1.4.9"

  # ── SCA UI ─────────────────────────────────────────────────────
  scaUi:
    imageTag: "1.4.9"

  # ── Core API ──────────────────────────────────────────────────
  coreApi:
    imageTag: "1.4.28"

  # ── Admin API ────────────────────────────────────────────────
  adminApi:
    imageTag: "1.4.28"

  # ── Channel Gateway ───────────────────────────────────────────
  channelGateway:
    scaBaseUrl: "https://isdalen.bjoroy.me"
    imageTag: "1.4.16"

  # ── Payment Engine (interbank) ────────────────────────────────
  paymentEngine:
    centralBankUrl: "http://bragd-rtgs-bragd-api.bragd-rtgs.svc.cluster.local:8095"
    bankId: "ISDA"
    bankSortCodes: "3288"
    nostroScheme: "bragd"
    imageTag: "1.4.28"

  # ── RTP Service Provider ────────────────────────────────────
  rtpSpApi:
    enabled: true
    imageTag: "0.2.3"
    participantName: "Isdalen Bank"
    bankBic: "ISDABRXX"
    ibanPrefixes: "NO3288"

  # ── Definitions Service ──────────────────────────────────────
  definitionsService:
    imageTag: "1.4.28"

  # ── Scheduler ────────────────────────────────────────────────
  scheduler:
    imageTag: "1.4.28"

  # ── Accounting (subchart) ─────────────────────────────────────
  accounting:
    accountingApi:
      imageTag: "0.1.7"

  # ── Database setup (pre-install) ─────────────────────────────
  setup:
    existingSecret: "postgres-admin"
    existingSecretKey: "password"

  # ── Ingress ───────────────────────────────────────────────────
  ingress:
    enabled: false
