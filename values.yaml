# Minoa Bank — instance overrides
# All other values inherit from the bjoroy-bank chart defaults

bjoroy-bank:
  global:
    instanceId: "minoa"
    domain: "bjoroy.me"
    imageTag: "1.4.41"
    imageRegistry: "oci.bjoroy.me/bank"
    dbHost: "postgres-postgresql.database.svc.cluster.local"

  # ── Bank identity (overrides chart defaults) ────────────────────
  bank:
    institution:
      bic: "MINOANO1XXX"
      name: "Minoa Bank"
      countryCode: "NO"
    prefix:
      type: "BKREG"
      value: "3188"
    series:
      - name: "Current Accounts"
        description: "Current accounts (3188 110000–119999)"
        rangeStart: 110000
        rangeEnd: 119999
      - name: "Savings Accounts"
        description: "Savings accounts (3188 120000–124999)"
        rangeStart: 120000
        rangeEnd: 124999
    products:
      - name: "Current Account"
        productType: "current_account"
        currency: "NOK"
        interestRate: "0.5"
        seriesIndex: 0
      - name: "Savings Account"
        productType: "savings_account"
        currency: "NOK"
        interestRate: "3.5"
        seriesIndex: 1

  # ── OIDC (Authentik) ──────────────────────────────────────────
  oidc: &bankOidc
    issuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
    jwksUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/jwks/"
    audience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"

  # ── Channel Service ────────────────────────────────────────────
  channelSvc:
    enabled: true
    oidc: *bankOidc
    channelSvc:
      imageTag: "0.1.1"

  # ── Auth Service ───────────────────────────────────────────────
  authService:
    imageTag: "1.4.24"

  # ── SCA UI ─────────────────────────────────────────────────────
  scaUi:
    imageTag: "1.4.24"

  # ── Core API ──────────────────────────────────────────────────
  coreApi:
    imageTag: "recovered-e73e9ebfc5f7@sha256:e73e9ebfc5f7372fb7c5584142b56f52e59ce0fb8045567d1532e2fcd9b57e2a"

  # ── Admin API ────────────────────────────────────────────────
  adminApi:
    imageTag: "recovered-9ffa5836b633@sha256:9ffa5836b6337d7d1d1e26b0c7b6d4adccdcc54268065d95fd271f5e6c328d2c"

  # ── Channel Gateway ───────────────────────────────────────────
  channelGateway:
    scaBaseUrl: "https://minoa-bank.bjoroy.me"
    imageTag: "1.4.24"

  # ── Payment Engine (interbank) ────────────────────────────────
  paymentEngine:
    centralBankUrl: "http://bragd-rtgs-bragd-api.bragd-rtgs.svc.cluster.local:8095"
    bankId: "MINO"
    bankSortCodes: "3188,3606,3607,3608,3609,3610"
    nostroScheme: "bragd"
    imageTag: "recovered-ae60c1d76676@sha256:ae60c1d76676183ca56c7752342576c178d6f38f87e03cc490dc173d1a8e3f20"

  # ── RTP Service Provider ────────────────────────────────────
  rtpSpApi:
    enabled: true
    imageTag: "0.2.4"
    participantName: "Minoa Bank"
    bankBic: "MINOBRXX"
    ibanPrefixes: "NO3188,NO3606,NO3607,NO3608,NO3609,NO3610"

  # ── Definitions Service ──────────────────────────────────────
  definitionsService:
    imageTag: "recovered-8287004fa630@sha256:8287004fa630061b9aeb9a104a56f40a5e71418524d155f04e86f07683398177"

  # ── Scheduler ────────────────────────────────────────────────
  scheduler:
    imageTag: "recovered-d2e9aee696a3@sha256:d2e9aee696a3effe99c95e951400ac6c3f364eca0264949f239f189043e4a0af"

  # ── Accounting (subchart) ─────────────────────────────────────
  accounting:
    accountingApi:
      imageTag: "0.1.7"
      bankTimezone: "Europe/Oslo"

  # ── Ingress ───────────────────────────────────────────────────
  ingress:
    enabled: false
