# Minoa Bank — instance overrides
# All other values inherit from the bjoroy-bank chart defaults

bjoroy-bank:
  global:
    instanceId: "minoa"
    domain: "bjoroy.me"
    imageTag: "1.4.41"
    imageRegistry: "oci.bjoroy.me/bank"
    dbHost: "postgres-postgresql.database.svc.cluster.local"

  # ── Bank identity (overrides chart defaults) ────────────────────
  bank:
    institution:
      bic: "MINOANO1XXX"
      name: "Minoa Bank"
      countryCode: "NO"
    prefix:
      type: "BKREG"
      value: "3188"
    series:
      - name: "Current Accounts"
        description: "Current accounts (3188 110000–119999)"
        rangeStart: 110000
        rangeEnd: 119999
      - name: "Savings Accounts"
        description: "Savings accounts (3188 120000–124999)"
        rangeStart: 120000
        rangeEnd: 124999
    products:
      - name: "Current Account"
        productType: "current_account"
        currency: "NOK"
        interestRate: "0.5"
        seriesIndex: 0
      - name: "Savings Account"
        productType: "savings_account"
        currency: "NOK"
        interestRate: "3.5"
        seriesIndex: 1

  # ── OIDC (Authentik) ──────────────────────────────────────────
  oidc: &bankOidc
    issuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
    jwksUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/jwks/"
    audience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"

  # ── Channel Service ────────────────────────────────────────────
  channelSvc:
    enabled: true
    oidc: *bankOidc
    channelSvc:
      imageTag: "0.1.1"

  # ── Auth Service ───────────────────────────────────────────────
  authService:
    imageTag: "1.4.24"

  # ── SCA UI ─────────────────────────────────────────────────────
  scaUi:
    imageTag: "1.4.24"

  # ── Core API ──────────────────────────────────────────────────
  coreApi:
    imageTag: "git-fa147297d0f5b52d6e1023c2c0d8923ee4d3b73a@sha256:5ccf7a01e8cb04d6d4c0a42514a6c028bd13d1b5d5459c7e9055770e9b85c03d"

  # ── Admin API ────────────────────────────────────────────────
  adminApi:
    imageTag: "git-d2f92d17e50ef41625d87f1ef80293c1df1eaa30@sha256:6a782169bcc159ca5081b314914a1f5436a5c77dcf48b7a400fc0731f2f4abb0"

  # ── Channel Gateway ───────────────────────────────────────────
  channelGateway:
    scaBaseUrl: "https://minoa-bank.bjoroy.me"
    imageTag: "1.4.24"

  # ── Payment Engine (interbank) ────────────────────────────────
  paymentEngine:
    centralBankUrl: "http://bragd-rtgs-bragd-api.bragd-rtgs.svc.cluster.local:8095"
    bankId: "MINO"
    bankSortCodes: "3188,3606,3607,3608,3609,3610"
    nostroScheme: "bragd"
    imageTag: "1.4.47@sha256:22d82a927c730a33b2251a60ceaca5ca7b1375da777370047723732c51815d80"

  # ── RTP Service Provider ────────────────────────────────────
  rtpSpApi:
    enabled: true
    imageTag: "0.2.4"
    participantName: "Minoa Bank"
    bankBic: "MINOBRXX"
    ibanPrefixes: "NO3188,NO3606,NO3607,NO3608,NO3609,NO3610"

  bankCalendarCutover:
    version: "deposit-interest-v1"
    openingApproval:
      bankInstanceId: "8ad66301-2528-4aff-a878-f5814957abfb"
