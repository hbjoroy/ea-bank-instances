# Isdalen Bank — instance overrides
# All other values inherit from the bjoroy-bank chart defaults

bjoroy-bank:
  global:
    instanceId: "isdalen"
    domain: "bjoroy.me"
    imageTag: "1.4.41"
    imageRegistry: "oci.bjoroy.me/bank"
    dbHost: "postgres-postgresql.database.svc.cluster.local"

  # ── Bank identity ───────────────────────────────────────────────
  bank:
    institution:
      bic: "ISDANO1XXX"
      name: "Isdalen Bank"
      countryCode: "NO"
    prefix:
      type: "BKREG"
      value: "3288"
    series:
      - name: "Current Accounts"
        description: "Current accounts (3288 110000–119999)"
        rangeStart: 110000
        rangeEnd: 119999
      - name: "Savings Accounts"
        description: "Savings accounts (3288 120000–124999)"
        rangeStart: 120000
        rangeEnd: 124999
    products:
      - name: "Current Account"
        productType: "current_account"
        currency: "NOK"
        interestRate: "0.5"
        seriesIndex: 0
      - name: "Savings Account"
        productType: "savings_account"
        currency: "NOK"
        interestRate: "3.5"
        seriesIndex: 1

  # ── OIDC (Authentik) ──────────────────────────────────────────
  oidc: &bankOidc
    issuerUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/"
    jwksUrl: "https://identity.limani-parou.com/application/o/bjoroy-bank/jwks/"
    audience: "aWWYVJ8dDmzoh8afB6fvSvAZcBSc8De42O5Mrfvg"

  # ── Channel Service ────────────────────────────────────────────
  channelSvc:
    enabled: true
    oidc: *bankOidc
    channelSvc:
      imageTag: "0.1.1"

  # ── Auth Service ───────────────────────────────────────────────
  authService:
    imageTag: "1.4.24"

  # ── SCA UI ─────────────────────────────────────────────────────
  scaUi:
    imageTag: "1.4.24"

  # ── Core API ──────────────────────────────────────────────────
  coreApi:
    imageTag: "1.4.46@sha256:ee3d7f7147cfeb298477d62e7c04b9b09f2cbbb3243cc0d39ea9a758f4cad55a"

  # ── Admin API ────────────────────────────────────────────────
  adminApi:
    imageTag: "1.4.46@sha256:1ab3d8800c97a8cce82ae7883f88424365d17cab83b13f42be9dda7fccdabe92"

  # ── Channel Gateway ───────────────────────────────────────────
  channelGateway:
    scaBaseUrl: "https://isdalen.bjoroy.me"
    imageTag: "1.4.24"

  # ── Payment Engine (interbank) ────────────────────────────────
  paymentEngine:
    centralBankUrl: "http://bragd-rtgs-bragd-api.bragd-rtgs.svc.cluster.local:8095"
    bankId: "ISDA"
    bankSortCodes: "3288"
    nostroScheme: "bragd"
    imageTag: "1.4.47@sha256:22d82a927c730a33b2251a60ceaca5ca7b1375da777370047723732c51815d80"

  # ── RTP Service Provider ────────────────────────────────────
  rtpSpApi:
    enabled: true
    imageTag: "0.2.4"
    participantName: "Isdalen Bank"
    bankBic: "ISDABRXX"
    ibanPrefixes: "NO3288"

  bankCalendarCutover:
    version: "deposit-interest-v1"
    openingApproval:
      bankInstanceId: "92bd614e-c1f9-4f2f-993b-4c0e833cb61b"
      firstBankDate: "2026-11-21"
      sha256: "449024e2af9d75dfa2078f6a01635ab708052a575b2779e4da1b3bcfc50413a7"
      approvedBy: "Harald Bjorøy / ISDALEN-MINOA-20261121 / 2026-11-20"

  # ── Definitions Service ──────────────────────────────────────
  definitionsService:
    imageTag: "1.4.46@sha256:a864d4e62b3dbacb132bcd53781e4697a47335c54d2fa93ec99d4929573ebf8e"

  # ── Scheduler ────────────────────────────────────────────────
  scheduler:
    imageTag: "1.4.46@sha256:e6014d447c828dc03144d3e959c50bc8e03c47052cc13faae20b1cda24046469"

  # ── Accounting (subchart) ─────────────────────────────────────
  accounting:
    accountingApi:
      imageTag: "git-842c8197d3fba047f6fb096576f135e867da7228@sha256:5ed2db870e1e84d69659a4c4e19c9b1f322b5679eced43c9763fb47961f3132b"
      bankTimezone: "Europe/Oslo"
      requireDepositOpening: true

  heart:
    image:
      repository: "oci.bjoroy.me/heart/api"
      tag: "0.4.1@sha256:56a1101ded1c5c17e08fdb343cb1a9e6ad784b079d6e389a822fd36b1f9ba9e4"

  treasury:
    treasuryApi:
      imageTag: "0.1.6@sha256:7de5eeb9853ed00420e78edc26e69fd476bc3bde8d5ee8ce82cbcce29ade8682"

  adminUi:
    adminUi:
      imageTag: "0.2.23@sha256:952d5660e228d2edf2888932c200810df2f8410779be7dfb82cace8a2c3602cd"

  # ── Database setup (pre-install) ─────────────────────────────
  setup:
    existingSecret: "postgres-admin"
    existingSecretKey: "password"

  # ── Ingress ───────────────────────────────────────────────────
  ingress:
    enabled: false
